name: Android Build

on:
  push:
    branches:
      - main
      - master
      - claude/**
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Release Keystore
      run: |
        if [ ! -f "release.keystore" ]; then
          echo "Generating new release keystore..."
          keytool -genkey -v -keystore release.keystore -alias triprepkey -keyalg RSA -keysize 2048 -validity 10000 -storepass triprep2024 -keypass triprep2024 -dname "CN=TriPrep, OU=Development, O=TriPrep, L=Paris, ST=IDF, C=FR"

          # Commit keystore to repository for future builds
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add release.keystore
          git commit -m "Add persistent release keystore for consistent app signing"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
        else
          echo "Using existing release keystore"
        fi
        ls -la release.keystore

    - name: Build with Gradle
      env:
        KEYSTORE_FILE: release.keystore
        KEYSTORE_PASSWORD: triprep2024
        KEY_ALIAS: triprepkey
        KEY_PASSWORD: triprep2024
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload APK to releases folder
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claude/')
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'

        # Pull latest changes (in case keystore was just committed)
        git pull origin ${GITHUB_REF#refs/heads/} --rebase

        # Copy APK to releases folder on current branch
        mkdir -p releases
        cp app/build/outputs/apk/release/app-release.apk releases/TriPrepApp-latest.apk

        # Commit and push to current branch
        git add releases/
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update release APK - $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
        fi

    - name: Create GitHub Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/claude/'))
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        files: app/build/outputs/apk/release/app-release.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
