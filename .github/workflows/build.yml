name: Android Build

on:
  push:
    branches:
      - main
      - master
      - claude/**
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Create Release Branch
      if: github.event_name == 'push'
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'

        # Create or update release branch
        git fetch origin release:release 2>/dev/null || git checkout -b release
        if [ $? -ne 0 ]; then
          git checkout -b release
        else
          git checkout release
        fi

        # Copy APK to release branch
        mkdir -p releases
        cp app/build/outputs/apk/release/app-release-unsigned.apk releases/TriPrepApp-latest.apk

        # Commit and push
        git add releases/
        git commit -m "Update release APK - $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
        git push origin release --force

    - name: Create GitHub Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/claude/'))
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        files: app/build/outputs/apk/release/app-release-unsigned.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
